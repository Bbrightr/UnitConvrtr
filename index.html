<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="index.css">
    </head>
    <body id="bodyContainer" >
        <div class="container" id="container">
            <div class="topSide">
                <button class="switchBtn" id="dark-mode-btn">Dark Mode</button>
               

                <h1>Metric/Imperial Unit Conversion</h1>
                <div><input class="converted" id="converted-value" type="number" placeholder="0" style="text-align: center;"></div>
                
                <button id="convert-btn"  onclick="convertbtn()">Convert</button>
            </div>

            <div class="bottomSide " >
                <div class="length-Con conv-dimen" id="length-con">
                    <h2 class="colorFirst">Length (Meter/Feet)</h2>
                    <p id="lengthConvert" class="conColor"> | </p>

                </div>
                <div class="vol-Con conv-dimen">
                    <h2 class="colorFirst">Volume (Liters/Gallons)</h2>
                    <p id="volumeConvert" class="conColor"> | </p>
                </div>
                <div class="mass-Con conv-dimen">
                    <h2 class="colorFirst">Mass (Kilograms/Pounds)</h2>
                    <p id="massConvert" class="conColor"> | </p>
                </div>
            </div>
        </div>
        
    </body>
    <script src="index.js" ></script>
</html>
